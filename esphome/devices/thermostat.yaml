climate:
  - &thermostat
    platform: template
    id: thermostat_k1a
    name: "Thermostat ${K1a}"
    icon: mdi:home-thermometer
    visual:
      min_temperature: 0
      max_temperature: 31
      temperature_step:
        target_temperature: 1
        current_temperature: 0.1
    sensor: temperature_k1a
    supports_action: true
    supported_modes:
      - "OFF"
      - "HEAT"
      - "COOL"
      - "FAN_ONLY"
    set_mode_action:
      then:
        - lambda: |-
            auto call_modeair = id(mode_air).make_call();
            auto call_modetest = id(mode_test).make_call();
            if (x == climate::CLIMATE_MODE_HEAT) {
              call_modeair.set_option(std::string("Confort Chauffage"));
              call_modetest.set_option(std::string("Aucun"));
            }
            else if (x == climate::CLIMATE_MODE_COOL) {
              call_modeair.set_option(std::string("Confort Clim"));
              call_modetest.set_option(std::string("Aucun"));
            }
            else if (x == climate::CLIMATE_MODE_FAN_ONLY) {
              call_modeair.set_option(std::string("Off"));
              call_modetest.set_option(std::string("Aéraulique"));
            }
            else if (x == climate::CLIMATE_MODE_OFF) {
              if (id(thermostat_global).mode == climate::CLIMATE_MODE_COOL) {
                auto call_temp = id(consigne_k1a).make_call();
                call_temp.number_to_max();
                call_temp.perform();
              }
              else {
                auto call_temp = id(consigne_k1a).make_call();
                call_temp.number_to_min();
                call_temp.perform();
              }
            }
            else {
              call_modeair.set_option(std::string("Off"));
              call_modetest.set_option(std::string("Aucun"));
            }
            call_modeair.perform();
            call_modetest.perform();
    #current_humidity_template: "{{ states('sensor.aqara_temperature_et_humidite_thermostat_k2_humidity') }}" # Avec capteur additionnel
    set_target_temperature_action:
      then:
        - lambda: |-
            uint16_t temperature = (uint16_t) x;
            if (x < 16 && (std::string(id(mode_air).current_option()) == std::string("Confort Chauffage") || std::string(id(mode_air).current_option()) == std::string("Eco Chauffage") || std::string(id(mode_air).current_option()) == std::string("Prog A Chauffage") || std::string(id(mode_air).current_option()) == std::string("Prog B Chauffage")))
              temperature = 16;
            else if (x > 24 && (std::string(id(mode_air).current_option()) == std::string("Confort Chauffage") || std::string(id(mode_air).current_option()) == std::string("Eco Chauffage") || std::string(id(mode_air).current_option()) == std::string("Prog A Chauffage") || std::string(id(mode_air).current_option()) == std::string("Prog B Chauffage")))
              temperature = 24;
            else if (x < 22 && (std::string(id(mode_air).current_option()) == std::string("Confort Clim") || std::string(id(mode_air).current_option()) == std::string("Boost Clim") || std::string(id(mode_air).current_option()) == std::string("Prog C Clim") || std::string(id(mode_air).current_option()) == std::string("Prog D Clim")))
              temperature = 22;
            else if (x > 31 && (std::string(id(mode_air).current_option()) == std::string("Confort Clim") || std::string(id(mode_air).current_option()) == std::string("Boost Clim") || std::string(id(mode_air).current_option()) == std::string("Prog C Clim") || std::string(id(mode_air).current_option()) == std::string("Prog D Clim")))
              temperature = 31;
            auto call = id(consigne_k1a).make_call();
            call.set_value(temperature);
            call.perform();

