output:
# Registre 20279
  - platform: modbus_controller
    modbus_controller_id: modbus_telecommande
    id: reset_anode
    address: 20279
    register_type: holding
    value_type: U_WORD
    write_lambda: |-
      payload.clear();
      payload.push_back(0x3);
      return 0;  // valeur interne, peu importe

button:
  - platform: template
    name: "Reset Anode"
    icon: mdi:history
    entity_category: config
    on_press:
      - output.turn_on:
          id: reset_anode
