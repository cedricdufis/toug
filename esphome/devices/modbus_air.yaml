uart:
  - id: U1
    tx_pin: GPIO17
    rx_pin: GPIO05
    baud_rate: 19200
    parity: EVEN
    stop_bits: 1

modbus:
  - id: modbus1
    uart_id: U1

modbus_controller:
  - address: 0x0001
    id: modbus_user
    update_interval: 10s
    modbus_id: modbus1

