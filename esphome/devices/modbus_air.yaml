number:
  # Registre 0x0096
  - &consigne
    platform: modbus_controller
    modbus_controller_id: modbus_user
    id: consigne_k1a
    name: "Consigne ${K1a}"
    icon: mdi:thermostat
    unit_of_measurement: "°C"
    address: 0x0096
    value_type: U_WORD
    use_write_multiple: true
    min_value: 0
    max_value: 31
    multiply: 100
    on_value: 
      then:
        - delay: 500ms
        - climate.template.publish:
            id: thermostat_k1a
            target_temperature: !lambda 'return (uint16_t) x;'
        - climate.template.publish:
            id: thermostat_global
            target_temperature: !lambda 'return (uint16_t) x;'
  # Registre 0x0097
  - <<: *consigne
    id: consigne_k1b
    name: "Consigne ${K1b}"
    internal: ${cacher_canal_k1b}
    address: 0x0097
    on_value: 
      then:
        - delay: 500ms
        - climate.template.publish:
            id: thermostat_k1b
            target_temperature: !lambda 'return (uint16_t) x;'
  # Registre 0x0098
