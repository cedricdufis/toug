number:
  # Registre 9 interne
  - platform: modbus_controller
    modbus_controller_id: modbus_telecommande
    id: registre_9_telecommande
    internal: true
    register_type: holding
    address: 9
    value_type: U_WORD
    on_value:
      - lambda: |-
          id(update_mode_air_telecommande).execute();
  # Registre 16 interne
  - platform: modbus_controller
    modbus_controller_id: modbus_telecommande
    id: registre_16_telecommande
    internal: true
    register_type: holding
    address: 16
    value_type: U_DWORD
  # Registre 64
  - platform: modbus_controller
    modbus_controller_id: modbus_telecommande
    id: debit_air_cible
    name: "Débit air cible"
    icon: mdi:turbine
    entity_category: config
    register_type: holding
    address: 64
    value_type: U_WORD
    unit_of_measurement: "m³/h"
    step: 1
    min_value: 0 #->100
    max_value: 1200
    write_lambda: |-
      // ici x = valeur demandée (en m³/h, avant multiplicateur)
      if (x > 0 && x < 100) {
        ESP_LOGW("modbus", "Valeur interdite (%f m³/h). Forcée à 0 m³/h.", x);
        return 0;   // renvoit une valeur valide
      }
      return x;  // valeur acceptée
    # Registre 152
  - platform: modbus_controller
    modbus_controller_id: modbus_telecommande
    id: vitesse_air_cible
    name: "Vitesse air cible"
    icon: mdi:windsock
    entity_category: config
    register_type: holding
    address: 152
    value_type: U_WORD
    unit_of_measurement: "m/s"
    step: 0.1
    min_value: 0
    max_value: 5
    multiply: 10
    # Registre 21011
  - platform: modbus_controller
    modbus_controller_id: modbus_telecommande
    id: consigne_ventilateur_ui_test
    name: "Consigne ventilateur UI Test"
    icon: mdi:fan-speed-2
    entity_category: config
    register_type: holding
    address: 21011
    value_type: U_WORD
    unit_of_measurement: "rpm"
    step: 50
    min_value: 0 #->150
    max_value: 750
    multiply: 10
    write_lambda: |-
      // ici x = valeur demandée (en Hz, avant multiplicateur)
      if (x > 0 && x < 150) {
        ESP_LOGW("modbus", "Valeur interdite (%f rpm). Forcée à 0 rpm.", x);
        return 0;   // renvoit une valeur valide
      }
      return x*10;  // valeur acceptée
    # Registre 21013
  - platform: modbus_controller
    modbus_controller_id: modbus_telecommande
    id: consigne_compresseur_test
    name: "Consigne compresseur test"
    icon: mdi:sine-wave
    entity_category: config
    register_type: holding
    address: 21013
    value_type: S_WORD
    unit_of_measurement: "Hz"
    step: 5
    min_value: 0 #->30
    max_value: 83
    multiply: 10
    write_lambda: |-
      // ici x = valeur demandée (en Hz, avant multiplicateur)
      if (x > 0 && x < 30) {
        ESP_LOGW("modbus", "Valeur interdite (%f Hz). Forcée à 0 Hz.", x);
        return 0;   // renvoit une valeur valide
      }
      return x*10;  // valeur acceptée
  # Registre 31008 interne
  - platform: modbus_controller
    modbus_controller_id: modbus_telecommande
    id: registre_31008_telecommande
    internal: true
    register_type: holding
    address: 31008
    value_type: U_DWORD
    on_value:
      - lambda: |-
          if (x == 0) {
            id(vacances).turn_off();
            id(hors_gel).turn_off();
          }
  # Registre 31010 interne
  - platform: modbus_controller
    modbus_controller_id: modbus_telecommande
    id: registre_31010_telecommande
    internal: true
    register_type: holding
    address: 31010
    value_type: U_DWORD
    on_value:
      - lambda: |-
          if (x == 0) {
            id(vacances).turn_off();
          }

