script:
  - id: update_mode_air_telecommande
    then:
      - lambda: |-
          uint16_t  value = (uint16_t )id(registre_9_telecommande).state;
          value = value & 0x00FF; 
          std::string mode_str;
          switch (value) {
            case 0:  mode_str = "Off"; break;
            case 1:  mode_str = "Confort Chauffage"; break;
            case 2:  mode_str = "Eco Chauffage"; break;
            case 3:  mode_str = "Prog A Chauffage"; break;
            case 4:  mode_str = "Prog B Chauffage"; break;
            case 5:  mode_str = "Confort Clim"; break;
            case 6:  mode_str = "Boost Clim"; break;
            case 7:  mode_str = "Prog C Clim"; break;
            case 8:  mode_str = "Prog D Clim"; break;
            case 9:  mode_str = "Ventilation"; break;
            default: mode_str = "Unknown"; break;
          }
          id(mode_air_telecommande).publish_state(mode_str);
          ESP_LOGD("Mode Air télécommande", "Publish state %s", mode_str.c_str());
  - id: auto_stop_test
    mode: restart
    then:
      - delay: 1h
      - select.set:
          id: mode_test
          option: "Aucun"
  - id: consigne_test
    mode: restart
    then:
      - delay: 75s
      - wait_until:
          condition:
            lambda: |- # Bouche ouverte & Mode Air & Test Clim ou Chauffage
              return 
                (int) id(canal_k1a).state  && 
                id(etat_circuit_frigo).state == "Coil AIR";
          timeout: 300s
      - if:
          condition:
            lambda: |-
              return 
                (int) id(canal_k1a).state  &&
                id(etat_circuit_frigo).state == "Coil AIR" &&
                (((int) id(id_test_actif).state == 4) || ((int) id(id_test_actif).state == 5));
          then: 
            - wait_until:
                condition:
                  lambda: |-
                    int nb_c = (int) id(nb_canaux).state;
                    int target_value = pow(2, nb_c + 1) - 1;
                    return (int) id(canaux_actifs).state > 0 &&
                           (int) id(etat_30).state >= target_value &&
                           (int) id(etat_35).state >= target_value;
                timeout: 300s
            - if:
                condition:
                  lambda: |-
                    return (int) id(canaux_actifs).state > 0;
                then:
                  - lambda: |-
                      auto call = id(consigne_compresseur_test).make_call();
                      call.set_value(83);
                      call.perform();
                      auto call2 = id(consigne_ventilateur_ui_test).make_call();
                      call2.set_value(600);
                      call2.perform();
                else:
                  - select.set:
                      id: mode_test
                      option: "Aucun"
                  - logger.log:
                      format: "TEST : Timeout activation -> Annulation"
                      level: ERROR
          else:
            - select.set:
                id: mode_test
                option: "Aucun"
            - logger.log:
                format: "TEST : Timeout test sélectionné -> Annulation"
                level: ERROR
  - id: update_modbus_from_datetime
    mode: parallel
    parameters:
      ModbusRegister: string
      datetimeRegister: string
    then:
      - lambda: |-
          ESPTime t;
          if(datetimeRegister == "reglage_date_heure")
            t = id(reglage_date_heure).state_as_esptime();
          else if(datetimeRegister == "vacances_debut")
            t = id(vacances_debut).state_as_esptime();
          else if(datetimeRegister == "vacances_fin")
            t = id(vacances_fin).state_as_esptime();
          // Validate ESPTime is valid
          // Check minimum date: 2016-01-01
          if (t.year < 2016) {
            ESP_LOGE("update_modbus_from_datetime", 
                     "Date %04d-%02d-%02d is before minimum (2016-01-01)",
                     t.year, t.month, t.day_of_month);
            return;
          }
          if (t.year > 2100) {
            ESP_LOGE("update_modbus_from_datetime", 
                     "Year %d exceeds maximum (2100)", t.year);
            return;
          }
          if (t.month < 1 || t.month > 12) {
            ESP_LOGE("update_modbus_from_datetime", "Invalid month: %d", t.month);
            return;
          }
          if (t.day_of_month < 1 || t.day_of_month > 31) {
            ESP_LOGE("update_modbus_from_datetime", "Invalid day: %d", t.day_of_month);
            return;
          }
          if (t.hour > 23 || t.minute > 59 || t.second > 59) {
            ESP_LOGE("update_modbus_from_datetime", 
                     "Invalid time: %02d:%02d:%02d", t.hour, t.minute, t.second);
            return;
          }
          // [Year offset from 1980 (7b:15-9)][Month (4b:8-5)][Day (5b:4-0)]
          uint16_t year_pac = (uint16_t)(t.year - 1980) & 0x7F;
          uint16_t date_reg = (year_pac << 9) | (t.month << 5) | t.day_of_month;
          // [Hours (5b:15-11)][Minutes (6b:10-5)][Seconds/2 (5b:4-0)]
          // Note: Seconds stored in 2-second steps (0-29 representing 0-58s)
          uint16_t time_reg = (t.hour << 11) | (t.minute << 5) | (t.second >> 1);
          // Combine into uint32_t
          uint32_t FATdatetime = ((uint32_t)date_reg << 16) | time_reg;
          // Apply timezone shift
          FATdatetime += 7200;
          // Publish
          if(ModbusRegister == "registre_16_telecommande")
            id(registre_16_telecommande).publish_state(FATdatetime);
          else if(ModbusRegister == "registre_31008_telecommande")
            id(registre_31008_telecommande).publish_state(FATdatetime);
          else if(ModbusRegister == "registre_31010_telecommande")
            id(registre_31010_telecommande).publish_state(FATdatetime);
          ESP_LOGD("update_modbus_from_datetime", 
                   "Encoded %04d-%02d-%02d %02d:%02d:%02d → 0x%08X",
                   t.year, t.month, t.day_of_month, t.hour, t.minute, t.second,
                   FATdatetime);
  - id: update_datetime_from_modbus
    mode: parallel
    parameters:
      ModbusRegister: string
      datetimeRegister: string
    then:
      - lambda: |-
          uint32_t FATdatetime;
          if(ModbusRegister == "registre_16_telecommande")
            FATdatetime = (uint32_t)id(registre_16_telecommande).state;
          else if(ModbusRegister == "registre_31008_telecommande")
            FATdatetime = (uint32_t)id(registre_31008_telecommande).state;
          else if(ModbusRegister == "registre_31010_telecommande")
            FATdatetime = (uint32_t)id(registre_31010_telecommande).state;
          // Validate we have data
          if (FATdatetime == 0) {
            ESP_LOGW("update_datetime_from_modbus", "No data at address %s", ModbusRegister);
            return;
          }
          // Apply timezone shift
          FATdatetime -= 7200;
          uint16_t date_reg = FATdatetime >> 16;
          uint16_t time_reg = FATdatetime & 0xFFFF;
          // Decode with validation
          uint16_t year = 1980 + ((date_reg >> 9) & 0x7F);
          uint8_t month = (date_reg >> 5) & 0x0F;
          uint8_t day = date_reg & 0x1F;
          uint8_t hour = (time_reg >> 11) & 0x1F;
          uint8_t minute = (time_reg >> 5) & 0x3F;
          uint8_t second = (time_reg & 0x1F) << 1;
          // Check minimum date: 2016-01-01
          if (year < 2016) {
            ESP_LOGE("update_datetime_from_modbus", 
                     "Decoded date %04d-%02d-%02d is before minimum (2016-01-01)",
                     year, month, day);
            return;
          }
          if (year > 2100) {
            ESP_LOGE("update_datetime_from_modbus", "Year %d exceeds maximum (2100)", year);
            return;
          }
          if (month < 1 || month > 12) {
            ESP_LOGE("update_datetime_from_modbus", "Invalid month: %d", month);
            return;
          }
          if (day < 1 || day > 31) {
            ESP_LOGE("update_datetime_from_modbus", "Invalid day: %d", day);
            return;
          }
          if (hour > 23 || minute > 59 || second > 59) {
            ESP_LOGE("update_datetime_from_modbus", 
                     "Invalid time: %02d:%02d:%02d", hour, minute, second);
            return;
          }
          ESPTime t;
          t.year = year;
          t.month = month;
          t.day_of_month = day;
          t.hour = hour;
          t.minute = minute;
          t.second = second;
          if(datetimeRegister == "reglage_date_heure") {
            auto call_reglage_date_heure = id(reglage_date_heure).make_call();
            call_reglage_date_heure.set_datetime(year, month, day, hour, minute, second);
            call_reglage_date_heure.perform();
          }
          else if(datetimeRegister == "vacances_debut") {
            auto call_vacances_debut = id(vacances_debut).make_call();
            call_vacances_debut.set_datetime(year, month, day, hour, minute, second);
            call_vacances_debut.perform();
          }
          else if(datetimeRegister == "vacances_fin") {
            auto call_vacances_fin = id(vacances_fin).make_call();
            call_vacances_fin.set_datetime(year, month, day, hour, minute, second);
            call_vacances_fin.perform();
          }
          ESP_LOGD("update_datetime_from_modbus", 
                   "Decoded: %04d-%02d-%02d %02d:%02d:%02d from 0x%08X",
                   year, month, day, hour, minute, second, FATdatetime);

uart:
  - id: U2
    tx_pin: GPIO14
    rx_pin: GPIO15
    baud_rate: 19200
    parity: EVEN
    stop_bits: 1

modbus:
  - id: modbus2
    uart_id: U2

modbus_controller:
  - address: 0x0001
    id: modbus_telecommande
    update_interval: 10s
    modbus_id: modbus2

binary_sensor:
  - platform: template
    id: status_vacances
    name: "Status vacances"
    icon: mdi:beach
    device_class: presence
    lambda: |-
      float t_deb = id(registre_31008_telecommande).state;
      float t_fin = id(registre_31010_telecommande).state;
      float t_now = id(registre_16_telecommande).state;
      if (std::isnan(t_deb) || std::isnan(t_fin) || t_deb == 0 || t_fin == 0)
        return false;
      if (t_now <= t_deb || t_fin <= t_now)
        return false;
      if (t_fin <= t_deb)
        return false;
      return true;
  - platform: template
    id: status_hors_gel
    name: "Status hors-gel"
    icon: mdi:snowflake
    device_class: presence
    lambda: |-
      float t_deb = id(registre_31008_telecommande).state;
      float t_fin = id(registre_31010_telecommande).state;
      float t_now = id(registre_16_telecommande).state;
      if (std::isnan(t_deb) || std::isnan(t_fin) || t_deb == 0 || t_fin != 0)
        return false;
      if (t_fin <= t_now)
        return false;
      if (t_fin <= t_deb)
        return false;
      return true;
