    raw_encode: HEXBYTES
    # Lambda pour décoder la valeur numérique en description textuelle
    lambda: |-
      uint16_t value = modbus::helpers::word_from_hex_str(x, 0);
      switch (value) {
        case 0: return std::string("État initial");
