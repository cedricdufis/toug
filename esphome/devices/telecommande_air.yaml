            plages += to_string(start) + "h-" + to_string(end) + "h";
            start = -1;
          }
        }
        if (plages.size() == 0) plages = "(aucune)";

        // Ajout au texte final
        out += jours[j];
        out += " : ";
        out += plages;
        if (j < 6) out += "\n";
      }

      return out;

